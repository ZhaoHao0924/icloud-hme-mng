name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Go and frontend verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go static analysis
        run: go vet ./...
      - name: Go race tests
        id: go-race
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          go test -race ./... 2>&1 | tee "$RUNNER_TEMP/go-race.log"
      - name: Publish Go race diagnostics
        if: steps.go-race.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '### Go race test output'
            echo
            echo '```text'
            tail -n 240 "$RUNNER_TEMP/go-race.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Annotate Go race diagnostics
        if: steps.go-race.outcome == 'failure'
        shell: bash
        run: |
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            line="${line//$'\n'/'%0A'}"
            printf '::error title=Go race diagnostics::%s\n' "$line"
          done < "$RUNNER_TEMP/go-race.log"
      - name: Upload Go race diagnostics
        if: steps.go-race.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: go-race-diagnostics
          path: ${{ runner.temp }}/go-race.log
          if-no-files-found: error
          retention-days: 7
      - name: Fail after publishing Go race diagnostics
        if: steps.go-race.outcome == 'failure'
        run: exit 1
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Frontend static checks and unit tests
        run: |
          npm --prefix web run format:check
          npm --prefix web run lint
          npm --prefix web run typecheck
          npm --prefix web test
          npm --prefix web run build
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Live browser regression tests
        id: live-e2e
        continue-on-error: true
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/playwright-live.log"
      - name: Mock browser regression tests
        id: mock-e2e
        continue-on-error: true
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e:mock 2>&1 | tee "$RUNNER_TEMP/playwright-mock.log"
      - name: Publish browser regression diagnostics
        if: steps.live-e2e.outcome == 'failure' || steps.mock-e2e.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '### Browser regression output'
            echo
            for log in "$RUNNER_TEMP"/playwright-*.log; do
              [[ -f "$log" ]] || continue
              echo "#### $(basename "$log")"
              echo
              echo '```text'
              tail -n 120 "$log"
              echo '```'
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Annotate browser regression diagnostics
        if: steps.live-e2e.outcome == 'failure' || steps.mock-e2e.outcome == 'failure'
        shell: bash
        run: |
          for log in "$RUNNER_TEMP"/playwright-*.log; do
            [[ -f "$log" ]] || continue
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              printf '::error title=Browser regression diagnostics::%s\n' "$line"
            done < <(tail -n 40 "$log")
          done
      - name: Fail after browser diagnostics
        if: steps.live-e2e.outcome == 'failure' || steps.mock-e2e.outcome == 'failure'
        run: exit 1
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  release-smoke:
    name: Release binary and Docker smoke test
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the embedded Linux release binary
        run: VERSION=ci bash build.sh
      - name: Assert release binary ELF metadata
        shell: bash
        run: |
          if output="$(go run ./scripts/assert_release_binary.go build/icloud-hme 2>&1)"; then
            printf '%s\n' "$output"
          else
            printf '%s\n' "$output"
            error_message="${output//$'\n'/ }"
            echo "::error title=Release binary ELF verification failed::$error_message"
            exit 1
          fi
      - name: Smoke test the Linux release binary
        id: linux-binary-smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash scripts/ci-linux-binary-smoke.sh build/icloud-hme 18082 2>&1 | tee "$RUNNER_TEMP/linux-binary-smoke.log"
      - name: Publish Linux binary smoke diagnostics
        if: steps.linux-binary-smoke.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '### Linux binary smoke output'
            echo
            echo '```text'
            tail -n 120 "$RUNNER_TEMP/linux-binary-smoke.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Annotate Linux binary smoke diagnostics
        if: steps.linux-binary-smoke.outcome == 'failure'
        shell: bash
        run: |
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            line="${line//$'\n'/'%0A'}"
            printf '::error title=Linux binary smoke diagnostics::%s\n' "$line"
          done < <(tail -n 40 "$RUNNER_TEMP/linux-binary-smoke.log")
      - name: Fail after Linux binary smoke diagnostics
        if: steps.linux-binary-smoke.outcome == 'failure'
        run: exit 1
      - name: Plant stale embedded asset sentinel
        run: |
          printf 'stale embedded asset sentinel\n' > internal/webui/dist/assets/ci-stale-sentinel.js
      - name: Build the Docker image
        run: docker build --build-arg VERSION=ci --tag icloud-hme:ci .
      - name: Smoke test the Docker image with a mounted data directory
        id: docker-smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash scripts/ci-docker-smoke.sh icloud-hme:ci 2>&1 | tee "$RUNNER_TEMP/docker-smoke.log"
      - name: Publish Docker smoke diagnostics
        if: steps.docker-smoke.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '### Docker smoke output'
            echo
            echo '```text'
            tail -n 120 "$RUNNER_TEMP/docker-smoke.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Annotate Docker smoke diagnostics
        if: steps.docker-smoke.outcome == 'failure'
        shell: bash
        run: |
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            line="${line//$'\n'/'%0A'}"
            printf '::error title=Docker smoke diagnostics::%s\n' "$line"
          done < <(tail -n 40 "$RUNNER_TEMP/docker-smoke.log")
      - name: Fail after Docker smoke diagnostics
        if: steps.docker-smoke.outcome == 'failure'
        run: exit 1
      - name: Upload release binary for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icloud-hme-linux-amd64
          path: build/icloud-hme
          if-no-files-found: ignore
          retention-days: 7

  publish-main-image:
    name: Publish main Docker image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [verify, release-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
      - name: Build and push main Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=main-${{ github.sha }}
          cache-from: type=gha,scope=main-image
          cache-to: type=gha,mode=max,scope=main-image

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, release-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend assets for release binaries
        run: |
          npm ci --prefix web
          npm --prefix web run build
          rm -rf internal/webui/dist/assets internal/webui/dist/index.html
          cp -R web/dist/. internal/webui/dist/
      - name: Build release binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          build_binary() {
            local goos="$1"
            local goarch="$2"
            local suffix="$3"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -buildvcs=false \
              -trimpath \
              -ldflags="-s -w -X main.version=${version}" \
              -o "dist/icloud-hme_${goos}_${goarch}${suffix}" \
              .
          }
          build_binary linux amd64 ""
          build_binary linux arm64 ""
          build_binary darwin amd64 ""
          build_binary darwin arm64 ""
          build_binary windows amd64 ".exe"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract release Docker metadata
        id: release-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release-meta.outputs.tags }}
          labels: ${{ steps.release-meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" dist/* --clobber
          else
            gh release create "$version" dist/* --title "$version" --generate-notes
          fi
